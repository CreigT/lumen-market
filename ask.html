<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ask the shop · Lumen Market</title>
  <link rel="stylesheet" href="/css/site.css">
</head>
<body data-page="ask">
  <main class="wrap section">
    <p class="kicker">AI commerce</p>
    <h1>Ask the shop.</h1>
    <p class="lede">A person talks. An agent answers. Pricing, sales, refunds, and governance each stay in their lane. No card is charged from this page.</p>
    <form data-ask>
      <label>What do you need?</label>
      <input name="message" required placeholder="How much is the tote, and can I return it?">
      <button class="btn" type="submit">Send to the agents</button>
    </form>
    <article class="card" data-reply style="margin-top:16px">
      <p class="muted">The Support Agent is waiting. Try a price, a buy, or a refund.</p>
    </article>
  </main>
  <script src="/config.js"></script>
  <script src="/js/site.js"></script>
</body>
</html>
